# Keycloak configuration
keycloak.url=http://localhost:8080
keycloak.realm=takweb
#keycloak.client-id=takweb-client
keycloak.client-id=takweb-dpop

# Spring Security OAuth2 - Keycloak
#spring.security.oauth2.client.registration.keycloak.client-id=takweb-client
spring.security.oauth2.client.registration.keycloak.client-id=takweb-dpop
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Public client (no secret) — PKCE is used automatically
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none

# Browser-facing URL (used in the redirect to Keycloak login page)
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/auth
# Server-to-server URLs (container reaches Keycloak via host.docker.internal)
spring.security.oauth2.client.provider.keycloak.token-uri=http://host.docker.internal:8080/realms/takweb/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://host.docker.internal:8080/realms/takweb/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://host.docker.internal:8080/realms/takweb/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
# Browser-facing logout — Keycloak terminates its own session and redirects back
spring.security.oauth2.client.provider.keycloak.end-session-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/logout
# Must match "Valid Post Logout Redirect URIs" configured in the Keycloak client
keycloak.post-logout-redirect-uri=http://localhost:8001/tak-web/auth/login

# ── DPoP configuration ───────────────────────────────────────────────────────
# The server-side DPoP keypair is generated automatically at startup (DpopKeyManager).
#
# dpop.validation.enabled — set to true on resource servers that must validate
# incoming DPoP-bound access tokens.  Keep false on tak-web itself (users authenticate
# via browser OIDC session, not via DPoP tokens).
# NOTE: Temporarily enabled for testing DPoP security with stolen tokens
dpop.validation.enabled=true
#
# To switch the Keycloak client to the DPoP-capable client (takweb-dpop.json imported
# into Keycloak), change these two lines:
#   spring.security.oauth2.client.registration.keycloak.client-id=takweb-dpop
#   keycloak.client-id=takweb-dpop
