# H2 in-memory database for test

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa
spring.sql.init.platform=h2
spring.jpa.defer-datasource-initialization=true
#spring.jpa.show-sql: true
spring.h2.console.enabled=true

# Console logging
logging.config=classpath:log4j2-test.xml

# Environment configuration
spring.config.import=optional:file:src/test/resources/tak-web-config.properties
tak.web.resource.dir=src/test/resources

# Keycloak configuration (test values)
keycloak.url=http://localhost:8080
keycloak.realm=takweb
keycloak.client-id=takweb-client
keycloak.post-logout-redirect-uri=http://localhost/tak-web/auth/login

# Spring Security OAuth2 - Keycloak (test values)
spring.security.oauth2.client.registration.keycloak.client-id=takweb-client
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.provider.keycloak.end-session-uri=http://localhost:8080/realms/takweb/protocol/openid-connect/logout
